# Local development and single-host deployment stack.
#
# D13 introduced the Redis Stack node only: it backs BOTH the conversation memory
# cache (med:chat:{tenant}:{dept}:{session}) and the RediSearch vector index used by
# the Spring AI RedisVectorStore (med:doc:* keys).
#
# D28 completes the stack: a MySQL 8 node (persistent, health-checked, schema/user
# provisioned by docker/mysql/init/01-create-db.sql) and the application service, which
# is built from the D27 multi-stage Dockerfile and waits for BOTH MySQL and Redis to be
# healthy before it starts. Flyway (V1..V3) then owns the in-database schema (tables),
# while the init script only provisions the database and the least-privilege account.
#
# Usage:
#   docker compose up -d            # full stack
#   docker compose up -d redis-stack   # cache/index only, for offline dev
#   docker compose --profile observability up -d   # + prometheus / alertmanager (D33)

name: springai-med-qa

services:
  redis-stack:
    # Redis Stack bundles RediSearch + RedisJSON, both required by RedisVectorStore.
    image: redis/redis-stack:7.4.0-v3
    container_name: med-qa-redis-stack
    ports:
      # 6379 -> Redis protocol (cache, Redisson locks, vector index)
      - "6379:6379"
      # 8001 -> RedisInsight UI, handy to inspect the FT index during development
      - "8001:8001"
    environment:
      REDIS_ARGS: "--appendonly yes --save 60 1000"
    volumes:
      - redis-stack-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mysql:
    # MySQL 8 is the source of truth for the sharded med_message_{0..15} tables and the
    # single med_session / med_audit_log tables (routed by ShardingSphere). The init
    # script (mounted below) creates the med_qa schema and the med_qa account; Flyway
    # then owns the tables on top of that schema.
    image: mysql:8.0.36
    container_name: med-qa-mysql
    command:
      # utf8mb4 everywhere so clinical text and UUIDv7 keys sort/store correctly.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # Only the root secret is set here; the application database and account are
      # provisioned idempotently by docker/mysql/init/01-create-db.sql on first boot.
      # Compose interpolation requires the `:-` form for a default; `${VAR:default}` is rejected at
      # parse time, which would make `docker compose up -d` fail before a single container starts.
      MYSQL_ROOT_PASSWORD: ${MED_MYSQL_ROOT_PASSWORD:-med_qa_root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # mysqladmin ping returns 0 only once the server accepts connections.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  app:
    # Built from the D27 multi-stage Dockerfile (JDK builder -> layered JRE runtime).
    # The container runs as the unprivileged `medqa` user and waits for both backing
    # stores to report healthy before it boots, so Flyway / Redis index creation never
    # races a not-yet-ready dependency.
    build:
      context: .
      dockerfile: Dockerfile
    image: springai-med-qa:local
    container_name: med-qa-app
    depends_on:
      mysql:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
    environment:
      # Active profile selects the prod-tuned wiring (lazy model beans, offline-safe).
      SPRING_PROFILES_ACTIVE: prod
      # MySQL connection (consumed by sharding/med-sharding.yaml placeholders).
      MED_MYSQL_HOST: mysql
      MED_MYSQL_PORT: "3306"
      MED_MYSQL_DATABASE: med_qa
      MED_MYSQL_USERNAME: med_qa
      MED_MYSQL_PASSWORD: med_qa
      # Redis connection (cache + Redisson + vector store).
      REDIS_HOST: redis-stack
      REDIS_PORT: "6379"
      # Local compose ships with auth off so the stack is runnable out of the box;
      # production overlays mount real API keys and set MED_SECURITY_ENABLED=true.
      MED_SECURITY_ENABLED: "false"
      MED_SECURITY_DEPT_SCOPE_ENABLED: "false"
      MED_RATE_LIMIT_ENABLED: "false"
    ports:
      - "8080:8080"
    healthcheck:
      # Spring Boot actuator/health is exposed via management.endpoint.health; a 200
      # from curl proves the context finished booting (Flyway, Redis index, etc.).
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # Observability profile (D33). Not started by a plain `docker compose up -d`: an operator opts in
  # with `--profile observability`, so a developer machine never pays for two extra containers.
  # Prometheus scrapes /actuator/prometheus and evaluates the rules in deploy/prometheus; on a
  # firing rule it notifies Alertmanager, whose routing lives in deploy/alertmanager.
  # ---------------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: med-qa-prometheus
    profiles: ["observability"]
    depends_on:
      app:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days is enough to compare a week-over-week regression without growing the volume forever.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/med-qa-alerts.yml:/etc/prometheus/rules/med-qa-alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      # 9090 -> Prometheus UI (targets, rules, alerts)
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: med-qa-alertmanager
    profiles: ["observability"]
    depends_on:
      prometheus:
        condition: service_started
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      # 9093 -> Alertmanager UI; the receiver inside the mounted config is a placeholder that must be
      # replaced with the team's real relay (see docs/DEPLOYMENT.md section 7).
      - "9093:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  redis-stack-data:
  mysql-data:
  prometheus-data:
  alertmanager-data:
