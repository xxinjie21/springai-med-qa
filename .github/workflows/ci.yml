# Continuous integration: build, test and publish JaCoCo coverage report.
#
# Triggered on every push / pull request targeting main. Runs `mvn verify`
# which executes the full unit test suite and generates the JaCoCo XML/HTML
# coverage report (bound to the verify phase in pom.xml), then uploads the
# report as a build artifact.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify with coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload surefire test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
