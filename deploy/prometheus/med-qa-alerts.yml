# Prometheus alerting rules for springai-med-qa (D33).
#
# Two families of rules:
#
#   * availability -- driven by `up` and by the med_qa_alert_total counter that
#     com.med.qa.alert.MetricsMedAlertSink publishes. The application already knows when MySQL or
#     Redis stops answering (MedStorageHealthIndicator), so the rules consume that verdict instead
#     of duplicating the probe with a second blackbox exporter.
#   * quality -- driven by the standard Spring Boot HTTP server meter, which is exported with
#     percentiles-histogram enabled (see the `management.metrics` block of application.yml).
#
# Every rule carries a `component` and a `severity` label so alertmanager can route by them and a
# dashboard can group by them. Keep the label sets small: they end up in the paging path.

groups:
  - name: med-qa-availability
    rules:
      - alert: MedQaTargetDown
        # `up == 0` means Prometheus could not scrape /actuator/prometheus at all: the process is
        # gone, the port is closed, or the endpoint stopped responding. The most severe signal.
        expr: up{job="med-qa"} == 0
        for: 1m
        labels:
          severity: critical
          component: app
        annotations:
          summary: "springai-med-qa is not scrapeable"
          description: >-
            Prometheus has failed to scrape {{ $labels.instance }} for more than a minute. The
            process is down, the actuator endpoint is unreachable, or the port is closed.
          runbook: "docs/DEPLOYMENT.md#7-健康检查与探针"

      - alert: MedQaStorageUnavailable
        # The application itself reported a store outage through the alert chain. `increase` rather
        # than `> 0` so a counter that reset with a pod restart still fires.
        expr: increase(med_qa_alert_total{code="storage-down"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          component: "{{ $labels.component }}"
        annotations:
          summary: "Storage component {{ $labels.component }} is unavailable"
          description: >-
            MedStorageHealthIndicator reported {{ $labels.component }} as unavailable. Consultation
            turns will fail to persist or to read the memory cache until it recovers.
          runbook: "docs/DEPLOYMENT.md#8-日志与故障排查"

      - alert: MedQaStorageProbeFailed
        # The health probe threw instead of returning a status, which means the probe itself is
        # broken and every storage signal below it is untrustworthy.
        expr: increase(med_qa_alert_total{code="storage-probe-failed"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: actuator
        annotations:
          summary: "The storage health probe is throwing"
          description: >-
            MedStorageHealthIndicator raised an exception instead of reporting a status, so
            /actuator/health is no longer a reliable readiness signal.
          runbook: "docs/DEPLOYMENT.md#7-健康检查与探针"

      - alert: MedQaRagIndexDegraded
        # D37. The application reported that the RediSearch index behind medical RAG is missing or
        # that its TAG schema drifted. Consultations keep returning 200, they just retrieve less, so
        # this is a warning rather than a page - but it must not be missed either: the first symptom
        # otherwise is a clinician reading an answer built from an incomplete corpus.
        expr: increase(med_qa_alert_total{code="rag-index-degraded"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: vector-index
        annotations:
          summary: "Medical RAG vector index is degraded"
          description: >-
            MedVectorIndexHealthIndicator reported the vector index as missing or schema-drifted
            (component {{ $labels.component }}). Scoped retrieval cannot be trusted until
            /actuator/health reports the med-vector-index component as UP again.
          runbook: "docs/DEPLOYMENT.md#7-健康检查与探针"

      - alert: MedQaRagIndexProbeFailed
        # D43. The index probe itself could not reach Redis, so there is no index verdict at all -
        # distinct from MedQaRagIndexDegraded, where the probe answered and found a repairable index.
        # This one pages: it is the signature of a total outage of the retrieval layer, and before
        # D43 the monitor could not tell it apart from a mere schema drift because
        # AbstractHealthIndicator#health() swallows the exception into a plain DOWN.
        expr: increase(med_qa_alert_total{code="rag-index-probe-failed"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
          component: vector-index
        annotations:
          summary: "The medical RAG vector index probe is failing"
          description: >-
            MedVectorIndexHealthIndicator could not reach the vector store, so the index verdict is
            unknown and /actuator/health reports reason=unreachable. Treat this as a Redis outage
            first: every scoped retrieval is failing while the consultation endpoint keeps returning
            200. Once Redis is reachable again the monitor emits rag-index-recovered.
          runbook: "docs/DEPLOYMENT.md#71-向量索引健康与-schema-漂移d37"

      - alert: MedQaRagIndexRebuildFailed
        # D38. A rebuild is an operator-triggered repair of the index D37 watches. When it fails, the
        # index may be gone, empty or half built - which is strictly worse than the drift it was
        # meant to repair - so unlike the degradation notice above this one pages: every consultation
        # keeps returning 200 while retrieving nothing.
        expr: increase(med_qa_alert_total{code="rag-index-rebuild-failed"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
          component: vector-index
        annotations:
          summary: "A medical RAG vector index rebuild failed"
          description: >-
            MedVectorIndexRebuilder reported outcome=failed or outcome=verification-failed for the
            vector index. The index may now be missing or empty, so scoped retrieval returns nothing
            until it is rebuilt successfully. Check /actuator/health (med-vector-index) and re-run the
            rebuild with MedIndexRebuildMode.INDEX_ONLY, which repairs the schema without touching
            documents.
          runbook: "docs/DEPLOYMENT.md#72-索引重建d38"

      - alert: MedQaSessionRetentionFailed
        # D47. The retention sweep archives consultations nobody has touched for idle-threshold. When
        # it fails, nothing breaks for a patient - consultations keep working - but med_session grows
        # without bound and the "stale sessions are archived automatically" guarantee quietly stops
        # holding. A warning rather than a page for exactly that reason, and a rule rather than a log
        # line because a job that stopped running looks identical to a hospital with no abandoned
        # sessions.
        expr: increase(med_qa_alert_total{code="session-retention-failed"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: session-retention
        annotations:
          summary: "The consultation retention sweep is failing"
          description: >-
            MedSessionRetentionScheduler reported a failed run, so stale ACTIVE sessions are not being
            archived. Check MySQL reachability and Redis (the sweep takes the cluster-wide mutex
            med:lock:session:retention before touching any row), then review
            med.session.retention.* - a dry-run deployment reports what it would do and never archives,
            which is not a failure.
          runbook: "docs/DEPLOYMENT.md#78-会话保留策略d47"

      - alert: MedQaSessionArchiveExportFailed
        # D48. The cold archive export copies the transcript of every archived consultation and
        # certifies it with a checksum. When a run fails, consultations keep working and no data is at
        # risk - the archive simply stops growing. That is exactly why it needs a rule: an archive that
        # stopped growing looks identical to a hospital with nothing to archive.
        expr: increase(med_qa_alert_total{code="session-archive-failed"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: session-archive
        annotations:
          summary: "The cold transcript archive export is failing"
          description: >-
            MedSessionArchiveExportScheduler reported a failed run, so archived consultations are not
            being copied to the cold store. Check MySQL reachability and Redis (the run takes the
            cluster-wide mutex med:lock:session:archive:export before touching any row), then review
            med.session.archive.* - a dry-run deployment reports what it would export and never copies,
            which is not a failure.
          runbook: "docs/DEPLOYMENT.md#79-冷归档导出d48"

      - alert: MedQaSessionArchiveMismatch
        # D48. The export refused to certify at least one transcript: either the source changed while it
        # was being copied, or the cold copy read back with a different digest. Nothing has been lost
        # (the export never deletes and never overwrites a certified session), so this is a warning -
        # but it is the only signal that says "the cold store does not hold what it claims to hold", and
        # it must not be averaged away by the sessions that exported cleanly in the same run.
        expr: increase(med_qa_alert_total{code="session-archive-mismatch"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: session-archive
        annotations:
          summary: "A cold archive copy failed its checksum verification"
          description: >-
            MedSessionArchiveExportScheduler refused certification for {{ $value }} transcript(s). The
            affected sessions keep no manifest and stay in the backlog, so the next run re-copies the
            missing messages and retries; repeated mismatches for the same session mean either the
            transcript is still being written (which ARCHIVED sessions must never be) or the archive
            rows are being altered outside the application. Verify one session with
            MedSessionArchiveExportService#verify before touching anything.
          runbook: "docs/DEPLOYMENT.md#79-冷归档导出d48"

      - alert: MedQaSessionPurgeFailed
        # D50. The hot-shard purge retires the sharded med_message rows of a certified archived session.
        # When a run fails, nothing has been lost - every deletion is preceded by a verification of both
        # copies - but the hot tier stops shrinking, and a purge that stopped running looks identical to a
        # hospital with nothing to purge.
        expr: increase(med_qa_alert_total{code="session-purge-failed"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: session-purge
        annotations:
          summary: "The archived-transcript hot-shard purge is failing"
          description: >-
            MedSessionPurgeScheduler reported a failed run, so certified archived sessions are keeping
            their hot shard rows. Check MySQL reachability and Redis (the run takes the cluster-wide mutex
            med:lock:session:purge before touching any row), then review med.session.purge.* - a dry-run
            deployment verifies and reports without deleting anything, which is not a failure.
          runbook: "docs/DEPLOYMENT.md#711-热分表清理d50"

      - alert: MedQaSessionPurgeRefused
        # D50. The purge declined to delete at least one session because it could not account for it: the
        # cold copy or the live shard no longer reproduces the manifest digest. Nothing was deleted - this
        # is the job refusing to act, not an incident on its own - but it is the only signal that says "the
        # two copies of this consultation disagree", and it will not clear by itself. A log line would hide
        # it, because a refused session keeps its hot rows and the backlog simply stops draining.
        expr: increase(med_qa_alert_total{code="session-purge-refused"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: session-purge
        annotations:
          summary: "A certified transcript could not be accounted for before purging"
          description: >-
            MedSessionPurgeService refused {{ $value }} session(s): either the cold copy in
            med_message_archive does not reproduce the payload_checksum recorded in med_session_archive, or
            the live shard does. Both copies were left untouched, so no data was lost. Verify one session
            with MedSessionArchiveExportService#verify and read it with
            GET /api/sessions/{sessionId}/transcript (which reports whether the hot shard or the cold copy
            answered) before changing anything; a repeated refusal for the same session means a copy is
            being altered outside the application.
          runbook: "docs/DEPLOYMENT.md#711-热分表清理d50"

      - alert: MedQaSessionReclaimFailed
        # D52. The orphan reclaim retires the cold copies a D51 restore left behind. When a run fails,
        # nothing has been lost - every deletion is preceded by a containment proof - but the cold store
        # stops shrinking, and a reclaim that stopped running looks identical to a hospital with no
        # orphaned copies.
        expr: increase(med_qa_alert_total{code="session-reclaim-failed"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: session-reclaim
        annotations:
          summary: "The orphaned cold copy reclaim is failing"
          description: >-
            MedSessionReclaimScheduler reported a failed run, so the cold copies a restore orphaned are
            keeping their rows in med_message_archive. Check MySQL reachability and Redis (the run takes
            the cluster-wide mutex med:lock:session:reclaim before touching any row), then review
            med.session.reclaim.* - a dry-run deployment verifies and reports without deleting anything,
            which is not a failure.
          runbook: "docs/DEPLOYMENT.md#713-孤儿冷副本回收d52"

      - alert: MedQaSessionReclaimRefused
        # D52. The reclaim declined to delete at least one cold copy because it could not account for it:
        # the copy holds messages the live transcript does not. Nothing was deleted - this is the job
        # refusing to act, not an incident on its own - but it is the only signal that says "there is a
        # copy of a consultation the application cannot account for", and it will not clear by itself. A
        # log line would hide it, because a refused copy stays a candidate and the backlog simply stops
        # draining, which looks exactly like a job that is keeping up.
        expr: increase(med_qa_alert_total{code="session-reclaim-refused"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: session-reclaim
        annotations:
          summary: "An orphaned cold copy could not be accounted for before being reclaimed"
          description: >-
            MedSessionReclaimService refused {{ $value }} session(s): med_message_archive holds messages
            that the live shard in med_message no longer holds, so the cold copy may be their only
            surviving record. Nothing was deleted. Read the session with
            GET /api/sessions/{sessionId}/transcript (which reports whether the hot shard or the cold copy
            answered) and compare the two copies before changing anything; a repeated refusal for the same
            session means the live rows were removed outside the application or the manifest was removed
            by hand - the purge refuses to run without one, so an orphan that is the only copy should not
            exist.
          runbook: "docs/DEPLOYMENT.md#713-孤儿冷副本回收d52"

      - alert: MedQaColdStoreBacklogGrowing
        # D54. The reclaim is the only thing that retires an orphaned cold copy, and until D54 nothing
        # said how big med_message_archive had grown or how old its oldest content was: "the reclaim is
        # keeping up with the orphans the restores produce" and "the reclaim falls further behind every
        # day" looked exactly the same from the outside. The gauge is refreshed by the reclaim itself
        # after every run it was allowed to delete, so a switched-off job and a deployment that only
        # measures (dry-run) publish no series at all and cannot reach this rule. The expression is
        # "never reached zero for a full day" rather than a derivative, because a healthy drain reads 0
        # on every sample and a derivative over a step-wise gauge adds a failure mode without adding a
        # question: min_over_time[24h] > 0 is exactly "the backlog existed the whole time and never
        # cleared".
        expr: min_over_time(med_qa_cold_store_reclaim_backlog[24h]) > 0
        for: 6h
        labels:
          severity: warning
          component: session-reclaim
        annotations:
          summary: "The orphaned cold copy backlog is not draining"
          description: >-
            med_qa_cold_store_reclaim_backlog has stayed above zero for a full day: the reclaim runs
            (med.session.reclaim.enabled=true, dry-run=false) but never drains the orphaned cold
            copies, so med_message_archive keeps growing. Either the restores are producing orphans
            faster than the run retires them (raise med.session.reclaim.max-batches or batch-size) or
            the copies are being refused (look for MedQaSessionReclaimRefused; a refused copy stays a
            candidate forever). A run that drains the backlog to zero resolves this on its own.
            med_qa_cold_store_rows and med_qa_cold_store_oldest_row_age_seconds show the size and the
            age of the table itself.
          runbook: "docs/DEPLOYMENT.md#715-冷库规模与年龄上报d54"

      - alert: MedQaAuditLogRetentionFailed
        # D55. The audit trail is append-only by design and its retention trim is the only delete
        # against it. A failed run loses nothing on its own, but the trail stops shrinking - and,
        # unlike the session jobs, this one deletes rows that exist nowhere else, so an operator
        # reading this alert wants to know immediately whether the run armed itself correctly
        # (dry-run deployments never fail on the delete path, they only count) before looking at
        # MySQL. Liveness itself is covered by the two D53 stall rules, whose selector this job's
        # component was added to: a trim that stopped running emits no failed alert at all.
        expr: increase(med_qa_alert_total{code="audit-log-retention-failed"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          component: audit-log-retention
        annotations:
          summary: "The audit log retention trim is failing"
          description: >-
            MedAuditLogRetentionScheduler reported a failed run, so med_audit_log keeps rows past the
            retention window. Check MySQL reachability and Redis (the run takes the cluster-wide mutex
            med:lock:audit-log:retention before touching any row), then review med.audit-log.retention.* -
            a dry-run deployment counts and reports without deleting anything, which is not a failure.
            Nothing is lost by the failed run itself: the trim only ever removes rows already past the
            cutoff, so the next successful run resumes exactly where this one stopped.
          runbook: "docs/DEPLOYMENT.md#716-审计日志的保留裁剪d55"

      - alert: MedQaBackgroundJobStalled
        # D53. Every other rule in this file is produced BY the component it watches, so none of them can
        # report that the component stopped running: a maintenance job that never fires emits no failure
        # alert and no completion notice, which is why "healthy and idle" and "dead since March" had
        # identical observability for four iterations. This rule is the other kind of signal - it fires on
        # the ABSENCE of data, which no dead job can suppress. med_qa_job_last_run_epoch_seconds advances on
        # every attempt, including the ones that step aside for another replica, so it answers exactly one
        # question: is this pod's scheduler still evaluating? The threshold is derived from
        # med_qa_job_expected_interval_seconds, which the application publishes from the same check-interval
        # it arms the job with, so slowing a job down does not mean editing this file. A job that is
        # deliberately switched off publishes no series at all and can never reach this rule.
        expr: >-
          time() - med_qa_job_last_run_epoch_seconds{component=~"session-.*|audit-log-retention"}
          > 2.5 * med_qa_job_expected_interval_seconds{component=~"session-.*|audit-log-retention"} + 300
        for: 15m
        labels:
          severity: warning
          component: "{{ $labels.component }}"
        annotations:
          summary: "Background job {{ $labels.component }} is not being attempted on {{ $labels.instance }}"
          description: >-
            No attempt has been recorded for {{ $labels.component }} on this instance for more than 2.5
            times its configured check-interval plus five minutes. The scheduler thread is gone, or the
            timer never fired. This is per-instance and therefore a warning: on a multi-replica deployment
            the work may still be happening elsewhere, and MedQaBackgroundJobNotCompleting is the rule that
            pages when it is not. A pod that restarts more often than this threshold resets its own clock
            and can hide behind it - pair this with an alert on the restart rate.
          runbook: "docs/DEPLOYMENT.md#714-后台作业的运行账本与停摆检测d53"

      - alert: MedQaBackgroundJobNotCompleting
        # D53. A different question from the rule above: not "is this pod's scheduler alive" but "is anybody
        # actually doing the work". last_run advances on every attempt, including the ones that lose the
        # cluster mutex, so it stays perfectly fresh while a leaked med:lock:session:* key turns all four
        # jobs into permanent no-ops - a failure mode no per-instance signal can see. last_success only
        # advances when a run really performed its passes, and its cluster-wide maximum is therefore the
        # only thing that catches that, or a job whose every run throws. This one pages rather than warns,
        # precisely because it is produced by the absence of data: no alert the job itself emits can cover a
        # job that emits nothing.
        expr: >-
          time() - max by (component) (med_qa_job_last_success_epoch_seconds{component=~"session-.*|audit-log-retention"})
          > 2.5 * max by (component) (med_qa_job_expected_interval_seconds{component=~"session-.*|audit-log-retention"}) + 300
        for: 15m
        labels:
          severity: critical
          component: "{{ $labels.component }}"
        annotations:
          summary: "No replica has completed a run of {{ $labels.component }}"
          description: >-
            No replica has completed a run of {{ $labels.component }} for more than 2.5 times its configured
            check-interval plus five minutes. Every run is failing, every run is losing the cluster mutex
            (look for a med:lock:session:* key left behind by a replica that was killed while holding it),
            or every replica's scheduler is down - MedQaBackgroundJobStalled tells those apart per instance.
            Use med_qa_job_runs_total{component="{{ $labels.component }}"} to see which outcome dominates.
            Nothing has been lost yet, but the guarantee this job exists for has stopped holding, and this
            rule is the only thing that will say so.
          runbook: "docs/DEPLOYMENT.md#714-后台作业的运行账本与停摆检测d53"

      - alert: MedQaAlertStorm
        # A burst of alerts is usually a symptom of a deeper problem (or of a mis-tuned rule) and
        # would otherwise drown the on-call engineer.
        expr: sum(increase(med_qa_alert_total[1h])) > 20
        for: 5m
        labels:
          severity: warning
          component: alerting
        annotations:
          summary: "Alert storm: more than 20 alerts in the last hour"
          description: >-
            The alert chain emitted {{ $value }} alerts in the last hour. Check for a flapping
            dependency or a mis-configured med.alert.cooldown before acting on each one.

  - name: med-qa-quality
    rules:
      - alert: MedQaHighServerErrorRate
        # 5xx ratio over the last five minutes, ignoring the low-traffic case where one error out of
        # three requests is statistically meaningless.
        expr: >-
          sum(rate(http_server_requests_seconds_count{application="springai-med-qa",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{application="springai-med-qa"}[5m])), 0.1)
          > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "More than 5% of API calls are failing with 5xx"
          description: >-
            {{ $value | humanizePercentage }} of requests over the last five minutes returned a 5xx.
            Check the LLM/embedding gateway and the storage probes first.
          runbook: "docs/DEPLOYMENT.md#8-日志与故障排查"

      - alert: MedQaConsultationLatencyHigh
        # p95 of the SSE consultation endpoint. The histogram buckets come from
        # management.metrics.distribution.percentiles-histogram.http.server.requests.
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{application="springai-med-qa",uri="/api/chat/stream"}[5m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
          component: chat
        annotations:
          summary: "p95 consultation latency is above 10s"
          description: >-
            The 95th percentile of /api/chat/stream has been above 10 seconds for ten minutes.
            Streamed answers are still correct, but the model gateway is likely degraded.

      - alert: MedQaRateLimitStorm
        # A sustained 429 rate means either a mis-behaving client or a limit that is too tight for
        # real clinical traffic - both need a human decision.
        expr: >-
          sum(rate(http_server_requests_seconds_count{application="springai-med-qa",status="429"}[10m])) > 1
        for: 10m
        labels:
          severity: warning
          component: ratelimit
        annotations:
          summary: "Sustained rate-limit rejections"
          description: >-
            More than one request per second has been rejected with 429 for ten minutes. Review
            med.rate-limit.default-rate and the per-endpoint @RateLimit settings.
          runbook: "docs/DEPLOYMENT.md#5-环境变量全表"
