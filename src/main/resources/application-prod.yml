spring:
  data:
    redis:
      # Supplied by the deployment secret store; empty locally so dev needs no credentials.
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.med.qa: INFO
