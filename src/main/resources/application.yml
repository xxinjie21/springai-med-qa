spring:
  application:
    name: springai-med-qa
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      # Redisson is used for locking/rate limiting only. Its auto-configuration would also replace
      # the Lettuce connection factory of the message cache and eagerly connect to Redis during
      # context refresh; config/RedissonConfig declares the client lazily instead.
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      # The Spring AI Redis vector store auto-configuration requires a JedisConnectionFactory bean
      # (this application runs Spring Data Redis on Lettuce) and creates the search index eagerly
      # during context refresh; config/VectorStoreConfig declares the store lazily instead.
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
      # Flyway auto-configuration would migrate through the single DataSource bean, which here is the
      # ShardingSphere proxy - the wrong target for DDL that creates the physical shards. See
      # med.storage.migration below; config/MedFlywayConfig replaces it with a migration that runs
      # against the physical MySQL server.
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  datasource:
    # All MySQL traffic goes through ShardingSphere-JDBC, which transparently routes
    # med_message writes/reads to med_message_{crc32(session_id) % 16}.
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding/med-sharding.yaml?placeholder-type=environment
    hikari:
      pool-name: med-qa-pool
  data:
    redis:
      # Backing store of the conversation memory cache, keys med:chat:{tenant}:{dept}:{session}.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s
      client-name: med-qa
  # Timeouts of the auto-configured RestClient.Builder, which config/EmbeddingModelConfig reuses for
  # the embedding endpoint. Embedding a batch of documents is slower than a chat turn, hence the
  # generous read timeout; the retry policy below turns a timeout into a bounded number of retries.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 60s
  ai:
    # Spring AI model auto-configuration is switched off: it instantiates every model eagerly and
    # fails when no API key is present, which would make the context unbootable on machines without
    # credentials. config/EmbeddingModelConfig declares the embedding model lazily from the very
    # same spring.ai.openai.* properties instead. Only the embedding side of the OpenAI starter is
    # used by this project.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # Any OpenAI-compatible gateway works, including an on-premise medical model server; only the
      # base URL changes. The key is never written to the repository.
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      embedding:
        embeddings-path: ${OPENAI_EMBEDDINGS_PATH:/v1/embeddings}
        # Only the document text is embedded; metadata tags stay out of the vector so they can be
        # used as filters without polluting similarity.
        metadata-mode: EMBED
        options:
          model: ${MED_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${MED_EMBEDDING_DIMENSIONS:1536}
    # Official retry/backoff policy applied to every model call by the Spring AI RetryTemplate.
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
      on-client-errors: false

# SpringDoc OpenAPI (D26): generates the OpenAPI 3 document + Swagger UI from the controllers at
# runtime. The docs endpoints are served under /v3/api-docs and /swagger-ui.html; the internal
# Spring-AI / actuator routes are not documented. try-it-out is enabled so clinicians can exercise
# the API directly from the browser.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    persist-authorization: true

# Conversation memory cache tuning; MySQL stays the source of truth so these values only
# trade Redis footprint against read amplification.
med:
  cache:
    ttl: ${MED_CACHE_TTL:30m}
    max-messages: ${MED_CACHE_MAX_MESSAGES:200}
  # Spring AI short-term memory window (MessageWindowChatMemory). Only the rolling window size is
  # configured here; the window is persisted through the two-tier repository (Redis + sharded MySQL).
  chat:
    max-messages: ${MED_CHAT_MAX_MESSAGES:20}
    # SSE streaming consultation endpoint tuning. A heartbeat comment keeps a slow or quiet connection
    # open; the timeout bounds how long an exchange may stay open before Spring closes it. Both are
    # seconds and must be positive. The streaming model itself is enabled separately via
    # spring.ai.model.chat plus an OpenAI-compatible API key (kept out of the repository).
    stream:
      heartbeat-interval-seconds: ${MED_CHAT_STREAM_HEARTBEAT:15}
      sse-timeout-seconds: ${MED_CHAT_STREAM_TIMEOUT:120}
  # Distributed session lock (Redisson RLock). lease-time 0 keeps the watchdog in charge, so a slow
  # LLM round trip cannot lose the lock while a crashed node still releases it after the watchdog
  # timeout.
  lock:
    wait-time: ${MED_LOCK_WAIT_TIME:3s}
    lease-time: ${MED_LOCK_LEASE_TIME:0s}
    watchdog-timeout: ${MED_LOCK_WATCHDOG_TIMEOUT:30s}
  # Consultation session lifecycle guard rails. The default page size and the title length cap only
  # bound what a single listing/creation call may request: the title cap protects the VARCHAR(255)
  # column of med_session, a page size cap keeps one listing call from sweeping a whole department.
  session:
    default-page-size: ${MED_SESSION_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${MED_SESSION_MAX_PAGE_SIZE:100}
    max-title-length: ${MED_SESSION_MAX_TITLE_LENGTH:200}
  # Schema migration target (D34). Flyway must talk to the physical MySQL server, never to the
  # ShardingSphere data source declared under spring.datasource: the migrations create the physical
  # shard tables med_message_0..15, which are precisely the tables the sharding proxy treats as
  # opaque. Driven through the proxy they fail twice over - Flyway's schema-existence probe reads
  # information_schema through it, concludes the schema is missing, issues CREATE DATABASE and dies
  # with MySQL error 1007 "database exists"; and even with schema creation switched off the first
  # CREATE TABLE aborts with "Load actual table metadata 'med_message_0' failed", because the proxy
  # tries to introspect a table that does not exist yet. Boot's Flyway auto-configuration is therefore
  # excluded in spring.autoconfigure.exclude, and config/MedFlywayConfig migrates through a dedicated
  # pool instead. The coordinates are the same MED_MYSQL_* variables the sharding file consumes, so
  # each deployment still has exactly one source of truth.
  #
  # The switch is spring.flyway.enabled (MedFlywayConfig honours it): the offline test suite already
  # pins it to false, so unit tests never reach for a database, while production leaves it unset and
  # migrates on startup.
  #
  # url is an optional full-URL override for targets host/port/database cannot express; leave it
  # unset in a normal deployment. The migration pool built from these coordinates is intentionally
  # NOT a DataSource bean: a second DataSource would make the type ambiguous for MyBatis and stop the
  # context from starting (see config/MedMigrationPool).
  storage:
    migration:
      host: ${MED_MYSQL_HOST:127.0.0.1}
      port: ${MED_MYSQL_PORT:3306}
      database: ${MED_MYSQL_DATABASE:med_qa}
      username: ${MED_MYSQL_USERNAME:med_qa}
      password: ${MED_MYSQL_PASSWORD:med_qa}
      url: ${MED_MIGRATION_URL:}
      locations: ${MED_MIGRATION_LOCATIONS:classpath:db/migration}
  # API-key authentication and patient-session ownership enforcement (D21). The filter is enabled by
  # default and fails closed: until API keys are mounted (per environment, never committed) every
  # request without a valid key is rejected with 401. Local dev / offline tests set
  # MED_SECURITY_ENABLED=false. The keys map pairs an opaque key with the principal it authenticates;
  # here it is intentionally empty so no secret lands in the repository.
  # dept-scope-enabled (D22) governs the @RequireDept interceptor: a caller reaching an endpoint of
  # another department is refused with 403 before the handler runs. It is a separate switch so the
  # declarative department check can be silenced without turning API-key authentication off.
  security:
    enabled: ${MED_SECURITY_ENABLED:true}
    require-auth: ${MED_SECURITY_REQUIRE_AUTH:true}
    dept-scope-enabled: ${MED_SECURITY_DEPT_SCOPE_ENABLED:true}
    header-name: ${MED_SECURITY_HEADER:X-API-Key}
  # Medical operation audit trail (D23): every @MedAudit annotated method appends one row to
  # med_audit_log with operator/action/target/latency/outcome. Enabled by default - switching it off
  # removes the evidence that an access was ever attempted, so MED_AUDIT_ENABLED=false belongs to
  # local development only. `order` keeps the aspect on the outside of the advice chain so the
  # recorded latency covers the whole call. The max-* limits are truncation guards bounded by the
  # physical column widths of med_audit_log: an over-long failure message must never turn a completed
  # medical operation into a failed insert. The trail stores identifiers and outcomes only - never
  # question text, model answers or retrieved documents.
  audit:
    enabled: ${MED_AUDIT_ENABLED:true}
    order: ${MED_AUDIT_ORDER:100}
    max-action-length: ${MED_AUDIT_MAX_ACTION_LENGTH:64}
    max-resource-type-length: ${MED_AUDIT_MAX_RESOURCE_TYPE_LENGTH:32}
    max-resource-id-length: ${MED_AUDIT_MAX_RESOURCE_ID_LENGTH:128}
    max-message-length: ${MED_AUDIT_MAX_MESSAGE_LENGTH:500}
  # Annotation-driven rate limiting (D25): per-caller, per-endpoint buckets backed by Redisson's
  # distributed RRateLimiter. enabled defaults to true; the offline test suite and local dev set
  # MED_RATE_LIMIT_ENABLED=false so the @RateLimit advice becomes a pass-through and never touches Redis.
  # key-prefix isolates the limiter keys from the med:chat: cache namespace and the med:lock: keys. Each
  # endpoint maps to its own bucket keyed by caller dimension (patient id, tenant id, or a SpEL key), so
  # one noisy patient cannot starve another. acquire-timeout-millis 0 rejects immediately when no permit
  # is free; default-rate / default-duration-seconds back the annotation when it omits rate()/durationSeconds().
  rate-limit:
    enabled: ${MED_RATE_LIMIT_ENABLED:true}
    order: ${MED_RATE_LIMIT_ORDER:50}
    key-prefix: ${MED_RATE_LIMIT_KEY_PREFIX:med:ratelimit:}
    acquire-timeout-millis: ${MED_RATE_LIMIT_ACQUIRE_TIMEOUT:0}
    default-rate: ${MED_RATE_LIMIT_DEFAULT_RATE:10}
    default-duration-seconds: ${MED_RATE_LIMIT_DEFAULT_DURATION:1}
  # Medical RAG vector index (Spring AI RedisVectorStore over Redis Stack / RediSearch). Only index
  # topology is configured; similarity search and Top-K selection belong to the official component.
  # The prefix must stay outside the med:chat: namespace so the index never scans cached
  # conversation windows. Retrieval is scoped through the metadata tags declared below - the
  # documents themselves are never parsed for entities.
  rag:
    vector-store:
      index-name: ${MED_RAG_INDEX_NAME:med-doc-index}
      prefix: ${MED_RAG_KEY_PREFIX:med:doc:}
      content-field-name: content
      embedding-field-name: embedding
      # HNSW keeps recall high as the corpus grows; switch to FLAT for exact search on small sets.
      vector-algorithm: ${MED_RAG_VECTOR_ALGORITHM:HNSW}
      distance-metric: COSINE
      initialize-schema: ${MED_RAG_INITIALIZE_SCHEMA:true}
      metadata-fields:
        - name: tenant_id
          type: TAG
        - name: dept_id
          type: TAG
        - name: patient_id
          type: TAG
    # Document ingestion guard rails. Batching of the embedding calls themselves is Spring AI's
    # TokenCountBatchingStrategy inside the store; these limits only bound how much a single
    # ingestion call pushes at it. Documents are indexed verbatim - never split, normalized or
    # scanned for entities - and are scoped only by the tenant/dept/patient tags declared above.
    ingestion:
      batch-size: ${MED_RAG_INGEST_BATCH_SIZE:25}
      max-content-length: ${MED_RAG_INGEST_MAX_CONTENT_LENGTH:20000}
      max-documents-per-request: ${MED_RAG_INGEST_MAX_DOCUMENTS:500}
    # Retrieval guard rails. Similarity scoring, Top-K selection and the translation of the
    # tenant/dept/patient tag filter into a native RediSearch query are all done by the official
    # RedisVectorStore; these limits only bound how much evidence one consultation turn may pull
    # into a prompt. similarity-threshold 0 is Spring AI's "accept all": a threshold tuned too high
    # returns nothing, which a clinician cannot tell apart from "the guideline does not exist".
    retrieval:
      top-k: ${MED_RAG_TOP_K:4}
      max-top-k: ${MED_RAG_MAX_TOP_K:50}
      similarity-threshold: ${MED_RAG_SIMILARITY_THRESHOLD:0.0}
      max-query-length: ${MED_RAG_MAX_QUERY_LENGTH:1000}
    # Embedding stage. The endpoint itself is configured through the official spring.ai.openai.*
    # block above; these two knobs are the ones the official properties cannot express: the width
    # the index is built with (cross-checked against the requested dimensions at wiring time) and
    # how documents are grouped into token-bounded embedding requests.
    embedding:
      expected-dimensions: ${MED_EMBEDDING_DIMENSIONS:1536}
      encoding-type: CL100K_BASE
      max-input-token-count: ${MED_EMBEDDING_MAX_INPUT_TOKENS:8191}
      reserve-percentage: 0.1
    # RAG question-answer advisor (Spring AI QuestionAnswerAdvisor) tuning. The advisor is built per
    # consultation scope by MedRagAdvisorFactory; this block only sets its chain order. Retrieval
    # Top-K, similarity threshold and the tenant/dept/patient tag isolation are governed by
    # med.rag.retrieval.* and MedRetrievalFilters, never here.
    advisor:
      order: ${MED_RAG_ADVISOR_ORDER:1}
    # Vector-index health monitoring (D37). A reachable Redis does not imply a usable RediSearch
    # index: the index can be absent (dropped, or FT.CREATE never succeeded because the instance is
    # not a Redis Stack build) or present with a TAG schema that drifted from the configuration above.
    # Neither case throws - the consultation endpoint keeps returning HTTP 200 and simply retrieves
    # less - so both are turned into an explicit /actuator/health component and a pushed alert.
    # expected-tag-fields MUST stay in step with the TAG entries of vector-store.metadata-fields
    # above: the probe can only detect the drift it is told to look for.
    # enabled=false removes both the health component and the alert monitor, which is what a
    # deployment running the cache on a plain Redis build (no RediSearch) has to set.
    index:
      enabled: ${MED_RAG_INDEX_ENABLED:true}
      check-interval: ${MED_RAG_INDEX_CHECK_INTERVAL:5m}
      initial-delay: ${MED_RAG_INDEX_INITIAL_DELAY:1m}
      expected-tag-fields:
        - tenant_id
        - dept_id
        - patient_id
  # Push-based alerting (D33). Actuator answers "am I healthy?" only to whoever asks; the monitor in
  # com.med.qa.alert polls the same storage probe on a schedule and pushes what it finds through the
  # log and Micrometer sinks. check-interval / initial-delay are read straight by the @Scheduled
  # annotation, so slowing the probing down needs no rebuild. cooldown is the shared suppression
  # window per (code, component) fingerprint, held in a Redisson TTL map so every replica shares it;
  # zero disables suppression while tuning a rule. minimum-severity is the signal/noise dial - raise
  # it to WARNING to silence recovery notices. muted-codes is the maintenance-window escape hatch.
  # enabled=false removes the whole chain, which is what the offline test suite wants.
  alert:
    enabled: ${MED_ALERT_ENABLED:true}
    check-interval: ${MED_ALERT_CHECK_INTERVAL:60s}
    initial-delay: ${MED_ALERT_INITIAL_DELAY:30s}
    cooldown: ${MED_ALERT_COOLDOWN:10m}
    minimum-severity: ${MED_ALERT_MINIMUM_SEVERITY:INFO}
    key-prefix: ${MED_ALERT_KEY_PREFIX:med:alert:}
    muted-codes: []
  # Generated API documentation (D26). The api-key-header mirrors med.security.header-name so the
  # Swagger UI "Authorize" button uses the exact header the ApiKeyAuthFilter enforces. The three
  # group paths split the surface into chat / session / rag dropdowns in Swagger UI.
  openapi:
    enabled: ${MED_OPENAPI_ENABLED:true}
    title: ${MED_OPENAPI_TITLE:Med-QA Hospital AI Consultation API}
    description: "${MED_OPENAPI_DESCRIPTION:Hospital-grade AI consultation backend: streaming chat, session lifecycle, and a tag-scoped medical RAG corpus. Every endpoint requires an API key in the configured header.}"
    version: ${MED_OPENAPI_VERSION:1.0.0}
    contact-name: ${MED_OPENAPI_CONTACT_NAME:Med-QA Team}
    contact-email: ${MED_OPENAPI_CONTACT_EMAIL:}
    contact-url: ${MED_OPENAPI_CONTACT_URL:}
    license-name: ${MED_OPENAPI_LICENSE_NAME:Apache 2.0}
    license-url: ${MED_OPENAPI_LICENSE_URL:https://www.apache.org/licenses/LICENSE-2.0}
    api-key-header: ${MED_SECURITY_HEADER:X-API-Key}
    chat-group-paths:
      - /api/chat/**
    session-group-paths:
      - /api/sessions/**
    rag-group-paths:
      - /api/rag/**

# MyBatis talks to the ShardingSphere DataSource; the med_message logical table is rewritten to the
# correct med_message_{crc32(session_id) % 16} physical table by ShardingSphere at runtime.
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-handlers-package: com.med.qa.mapper.typehandler

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # health/info back the container probe and the version matrix; prometheus (D33) is the
        # scrape target of deploy/prometheus/prometheus.yml. The alert rules in that directory read
        # med_qa_alert_total, which only exists because the Prometheus registry is on the classpath.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      # Expose the /actuator/health/liveness and /actuator/health/readiness groups consumed by the
      # Kubernetes probes documented in docs/DEPLOYMENT.md. Both groups inherit the aggregate
      # status, so an unreachable MySQL or Redis store takes the pod out of rotation.
      probes:
        enabled: true
  metrics:
    # Every series carries the application name, so a Prometheus instance scraping several services
    # can still isolate this one without relying on the job label.
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets on the HTTP meter (D33): the MedQaConsultationLatencyHigh rule needs
      # histogram_quantile, which is only computable from _bucket series.
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    com.med.qa: INFO
