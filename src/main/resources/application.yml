spring:
  application:
    name: springai-med-qa
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      # Redisson is used for locking/rate limiting only. Its auto-configuration would also replace
      # the Lettuce connection factory of the message cache and eagerly connect to Redis during
      # context refresh; config/RedissonConfig declares the client lazily instead.
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      # The Spring AI Redis vector store auto-configuration requires a JedisConnectionFactory bean
      # (this application runs Spring Data Redis on Lettuce) and creates the search index eagerly
      # during context refresh; config/VectorStoreConfig declares the store lazily instead.
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
  datasource:
    # All MySQL traffic goes through ShardingSphere-JDBC, which transparently routes
    # med_message writes/reads to med_message_{crc32(session_id) % 16}.
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding/med-sharding.yaml?placeholder-type=environment
    hikari:
      pool-name: med-qa-pool
  data:
    redis:
      # Backing store of the conversation memory cache, keys med:chat:{tenant}:{dept}:{session}.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s
      client-name: med-qa
  # Timeouts of the auto-configured RestClient.Builder, which config/EmbeddingModelConfig reuses for
  # the embedding endpoint. Embedding a batch of documents is slower than a chat turn, hence the
  # generous read timeout; the retry policy below turns a timeout into a bounded number of retries.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 60s
  ai:
    # Spring AI model auto-configuration is switched off: it instantiates every model eagerly and
    # fails when no API key is present, which would make the context unbootable on machines without
    # credentials. config/EmbeddingModelConfig declares the embedding model lazily from the very
    # same spring.ai.openai.* properties instead. Only the embedding side of the OpenAI starter is
    # used by this project.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # Any OpenAI-compatible gateway works, including an on-premise medical model server; only the
      # base URL changes. The key is never written to the repository.
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      embedding:
        embeddings-path: ${OPENAI_EMBEDDINGS_PATH:/v1/embeddings}
        # Only the document text is embedded; metadata tags stay out of the vector so they can be
        # used as filters without polluting similarity.
        metadata-mode: EMBED
        options:
          model: ${MED_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${MED_EMBEDDING_DIMENSIONS:1536}
    # Official retry/backoff policy applied to every model call by the Spring AI RetryTemplate.
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
      on-client-errors: false

# Conversation memory cache tuning; MySQL stays the source of truth so these values only
# trade Redis footprint against read amplification.
med:
  cache:
    ttl: ${MED_CACHE_TTL:30m}
    max-messages: ${MED_CACHE_MAX_MESSAGES:200}
  # Spring AI short-term memory window (MessageWindowChatMemory). Only the rolling window size is
  # configured here; the window is persisted through the two-tier repository (Redis + sharded MySQL).
  chat:
    max-messages: ${MED_CHAT_MAX_MESSAGES:20}
    # SSE streaming consultation endpoint tuning. A heartbeat comment keeps a slow or quiet connection
    # open; the timeout bounds how long an exchange may stay open before Spring closes it. Both are
    # seconds and must be positive. The streaming model itself is enabled separately via
    # spring.ai.model.chat plus an OpenAI-compatible API key (kept out of the repository).
    stream:
      heartbeat-interval-seconds: ${MED_CHAT_STREAM_HEARTBEAT:15}
      sse-timeout-seconds: ${MED_CHAT_STREAM_TIMEOUT:120}
  # Distributed session lock (Redisson RLock). lease-time 0 keeps the watchdog in charge, so a slow
  # LLM round trip cannot lose the lock while a crashed node still releases it after the watchdog
  # timeout.
  lock:
    wait-time: ${MED_LOCK_WAIT_TIME:3s}
    lease-time: ${MED_LOCK_LEASE_TIME:0s}
    watchdog-timeout: ${MED_LOCK_WATCHDOG_TIMEOUT:30s}
  # Medical RAG vector index (Spring AI RedisVectorStore over Redis Stack / RediSearch). Only index
  # topology is configured; similarity search and Top-K selection belong to the official component.
  # The prefix must stay outside the med:chat: namespace so the index never scans cached
  # conversation windows. Retrieval is scoped through the metadata tags declared below - the
  # documents themselves are never parsed for entities.
  rag:
    vector-store:
      index-name: ${MED_RAG_INDEX_NAME:med-doc-index}
      prefix: ${MED_RAG_KEY_PREFIX:med:doc:}
      content-field-name: content
      embedding-field-name: embedding
      # HNSW keeps recall high as the corpus grows; switch to FLAT for exact search on small sets.
      vector-algorithm: ${MED_RAG_VECTOR_ALGORITHM:HNSW}
      distance-metric: COSINE
      initialize-schema: ${MED_RAG_INITIALIZE_SCHEMA:true}
      metadata-fields:
        - name: tenant_id
          type: TAG
        - name: dept_id
          type: TAG
        - name: patient_id
          type: TAG
    # Document ingestion guard rails. Batching of the embedding calls themselves is Spring AI's
    # TokenCountBatchingStrategy inside the store; these limits only bound how much a single
    # ingestion call pushes at it. Documents are indexed verbatim - never split, normalized or
    # scanned for entities - and are scoped only by the tenant/dept/patient tags declared above.
    ingestion:
      batch-size: ${MED_RAG_INGEST_BATCH_SIZE:25}
      max-content-length: ${MED_RAG_INGEST_MAX_CONTENT_LENGTH:20000}
      max-documents-per-request: ${MED_RAG_INGEST_MAX_DOCUMENTS:500}
    # Retrieval guard rails. Similarity scoring, Top-K selection and the translation of the
    # tenant/dept/patient tag filter into a native RediSearch query are all done by the official
    # RedisVectorStore; these limits only bound how much evidence one consultation turn may pull
    # into a prompt. similarity-threshold 0 is Spring AI's "accept all": a threshold tuned too high
    # returns nothing, which a clinician cannot tell apart from "the guideline does not exist".
    retrieval:
      top-k: ${MED_RAG_TOP_K:4}
      max-top-k: ${MED_RAG_MAX_TOP_K:50}
      similarity-threshold: ${MED_RAG_SIMILARITY_THRESHOLD:0.0}
      max-query-length: ${MED_RAG_MAX_QUERY_LENGTH:1000}
    # Embedding stage. The endpoint itself is configured through the official spring.ai.openai.*
    # block above; these two knobs are the ones the official properties cannot express: the width
    # the index is built with (cross-checked against the requested dimensions at wiring time) and
    # how documents are grouped into token-bounded embedding requests.
    embedding:
      expected-dimensions: ${MED_EMBEDDING_DIMENSIONS:1536}
      encoding-type: CL100K_BASE
      max-input-token-count: ${MED_EMBEDDING_MAX_INPUT_TOKENS:8191}
      reserve-percentage: 0.1
    # RAG question-answer advisor (Spring AI QuestionAnswerAdvisor) tuning. The advisor is built per
    # consultation scope by MedRagAdvisorFactory; this block only sets its chain order. Retrieval
    # Top-K, similarity threshold and the tenant/dept/patient tag isolation are governed by
    # med.rag.retrieval.* and MedRetrievalFilters, never here.
    advisor:
      order: ${MED_RAG_ADVISOR_ORDER:1}

# MyBatis talks to the ShardingSphere DataSource; the med_message logical table is rewritten to the
# correct med_message_{crc32(session_id) % 16} physical table by ShardingSphere at runtime.
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-handlers-package: com.med.qa.mapper.typehandler

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.med.qa: INFO
