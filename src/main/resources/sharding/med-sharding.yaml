# ShardingSphere-JDBC rule configuration for the unified medical session storage spec.
#
# Physical layout: med_message_{crc32(session_id) % 16} across 16 tables in a single MySQL schema.
# Routing, SQL rewriting and result merging are performed by ShardingSphere; the only project code
# involved is the MED_CRC32_MOD algorithm plugin (com.med.qa.memory.sharding.Crc32ShardingAlgorithm).
#
# Placeholders use the ShardingSphere `$${ENV_NAME::default}` syntax and are resolved because the
# JDBC URL declares `?placeholder-type=environment`.

databaseName: med_qa

dataSources:
  med_ds:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    # characterEncoding takes a JAVA charset name, not a MySQL one. `utf8mb4` is a MySQL server
    # charset and Connector/J rejects it outright with
    # "java.io.UnsupportedEncodingException: utf8mb4" before the connection is ever opened, which
    # makes the whole service unable to reach MySQL. `UTF-8` is the correct value: the driver then
    # negotiates utf8mb4 on the wire against the utf8mb4 server configured in docker-compose.yml.
    jdbcUrl: jdbc:mysql://$${MED_MYSQL_HOST::127.0.0.1}:$${MED_MYSQL_PORT::3306}/$${MED_MYSQL_DATABASE::med_qa}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: $${MED_MYSQL_USERNAME::med_qa}
    password: $${MED_MYSQL_PASSWORD::med_qa}
    minimumIdle: 4
    maximumPoolSize: 32
    connectionTimeout: 5000
    idleTimeout: 60000
    maxLifetime: 1800000

rules:
  - !SHARDING
    tables:
      med_message:
        actualDataNodes: med_ds.med_message_${0..15}
        tableStrategy:
          standard:
            shardingColumn: session_id
            shardingAlgorithmName: med_message_crc32_mod
    shardingAlgorithms:
      med_message_crc32_mod:
        type: MED_CRC32_MOD
        props:
          sharding-count: 16

  # Sessions and the audit trail live in non-sharded tables. The SINGLE rule lets ShardingSphere
  # manage them on med_ds (routing and metadata) alongside the sharded med_message tables;
  # defaultDataSource ensures any future unconfigured table still resolves instead of failing with
  # "table not found".
  - !SINGLE
    tables:
      - med_ds.med_session
      - med_ds.med_audit_log
    defaultDataSource: med_ds

props:
  sql-show: false
  sql-simple: false
